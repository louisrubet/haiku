id: kikaku-toshi-no-se
status: published
added: "2026-11-22"
author: takarai-kikaku
form: hokku
season: winter
kigo: 年の瀬
original:
  language: ja-Jpan
  text: |-
    年の瀬や
    水の流れも
    人の身も
  rights:
    status: public-domain
    basis: Author died in 1707.
translations:
  - language: fr-Latn
    text: |-
      Oh! la queue de l'année!
      Le corps de l'homme,
      Comme au cours de l'eau!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 390."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n403/mode/1up"
    notes: "Traditionally attributed to Kikaku, in the story of the forty-seven ronin."
    rights:
      status: public-domain
      basis: "Translator died in 1947."
