id: onitsura-mata-hitotsu
status: published
added: "2026-11-22"
author: uejima-onitsura
form: hokku
season: spring
kigo: 花
original:
  language: ja-Jpan
  text: |-
    又ひとつ
    花につれゆく
    命かな
  rights:
    status: public-domain
    basis: Author died in 1738.
translations:
  - language: fr-Latn
    text: |-
      Encore une
      Fleur : ainsi va et passe
      La vie!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 395."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n408/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Together with one blossom more,
      Oh! life, thou goest on thy way.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 346, no. 163."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n373/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
