id: basho-okiyo-okiyo
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: spring
kigo: 胡蝶
original:
  language: ja-Jpan
  text: |-
    起きよ起きよ
    我が友にせん
    ぬる胡蝶
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Réveille-toi, réveille-toi!
      Je ferai de toi mon ami,
      O papillon qui dors!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 386."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n399/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Awake! awake! I’ll make of thee
      My comrade, sleeping butterfly.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 320, no. 79."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n347/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
