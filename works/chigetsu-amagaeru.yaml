id: chigetsu-amagaeru
status: published
added: "2026-11-22"
author: kawai-chigetsu
form: hokku
season: summer
kigo: 雨蛙
original:
  language: ja-Jpan
  text: |-
    麦藁の
    家してやらん
    雨蛙
  rights:
    status: public-domain
    basis: Author died in 1718.
translations:
  - language: fr-Latn
    text: |-
      De paille d'orge
      Je te ferai une maison,
      Grenouille religieuse!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 394."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n407/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      I’ll take some barley straw and make
      A house for you, little green frog!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 340, no. 144."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n367/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
