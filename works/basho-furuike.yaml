id: basho-furuike
status: published
added: "2026-11-20"
author: matsuo-basho
form: hokku
season: spring
kigo: 蛙
tags: [water, frog]
original:
  language: ja-Jpan
  text: |-
    古池や
    蛙飛び込む
    水の音
  romanization:
    language: ja-Latn
    system: Hepburn
    text: |-
      furuike ya
      kawazu tobikomu
      mizu no oto
  composed: "1686"
  first_published:
    title: Haru no hi
    title_original: 春の日
    year: "1686"
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Ah! le vieil étang!
      Et le bruit de l'eau
      Où saute la grenouille!
    translator: michel-revon
    translated: "1910"
    source: Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 387.
    source_url: https://archive.org/details/anthologiedelal00revogoog/page/n400/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1947.
  - language: en-Latn
    text: |-
      The old pond, aye! and the sound of a frog leaping into the water.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 279, no. 32."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n306/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
