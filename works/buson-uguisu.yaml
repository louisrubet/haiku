id: buson-uguisu
status: published
added: "2026-11-22"
author: yosa-buson
form: hokku
season: spring
kigo: 鶯
original:
  language: ja-Jpan
  text: |-
    鶯や
    家内揃うて
    飯時分
  rights:
    status: public-domain
    basis: Author died in 1784.
translations:
  - language: fr-Latn
    text: |-
      Ah! le rossignol!
      Et toute la famille,
      A l'heure du repas!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 397."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n410/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The nightingale and—dinner-time,
      With the whole family assembled.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 350, no. 175."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n377/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
