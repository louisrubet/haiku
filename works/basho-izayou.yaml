author: matsuo-basho
form: hokku
season: autumn
kigo: いざよふ
original:
  language: ja-Jpan
  text: |-
    やすやすと
    出でていざよふ
    月の雲
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Des nuages, la lune
      Qui décroît, combien elle sort
      Aisément!
