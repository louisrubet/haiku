id: basho-izayou
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: autumn
kigo: いざよふ
original:
  language: ja-Jpan
  text: |-
    やすやすと
    出でていざよふ
    月の雲
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Des nuages, la lune
      Qui décroît, combien elle sort
      Aisément!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 387."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n400/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! clouds about the moon, from whence
      She falters forth so debonnair!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 323, no. 89."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n350/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
