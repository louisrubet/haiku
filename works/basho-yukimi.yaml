id: basho-yukimi
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: winter
kigo: 雪見
original:
  language: ja-Jpan
  text: |-
    いざさらば
    雪見にころぶ
    所まで
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Maintenant, allons,
      Jusqu'à l'endroit où
      Nous tomberons, admirer la neige!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 388."
