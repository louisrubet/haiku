id: basho-watabatake
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: autumn
kigo: 名月
original:
  language: ja-Jpan
  text: |-
    名月の
    花かと見えて
    棉畠
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Au brillant clair de lune
      Ce qui semblait être des fleurs,
      C'est un champ de cotonniers.
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 388."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n401/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      In the bright moonlight what appeared
      Like flowers is a cotton field.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 323, no. 88."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n350/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
