id: basho-watabatake
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: autumn
kigo: 名月
original:
  language: ja-Jpan
  text: |-
    名月の
    花かと見えて
    棉畠
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Au brillant clair de lune
      Ce qui semblait être des fleurs,
      C'est un champ de cotonniers.
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 388."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n401/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
