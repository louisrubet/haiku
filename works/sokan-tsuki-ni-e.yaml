id: sokan-tsuki-ni-e
status: published
added: "2026-11-22"
author: yamazaki-sokan
form: hokku
season: summer
kigo: 団扇
original:
  language: ja-Jpan
  text: |-
    月に柄を
    さしたらばよき
    団扇かな
  rights:
    status: public-domain
    basis: Author died in 1553.
translations:
  - language: fr-Latn
    text: |-
      A la lune, un manche
      Si l'on appliquait, le bel
      Eventail!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 383."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n396/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Add but a handle to the moon,
      And what a pretty fan it makes!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 311, no. 49."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n338/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
