id: ryota-meigetsu
status: published
added: "2026-11-22"
author: oshima-ryota
form: hokku
season: autumn
kigo: 名月
original:
  language: ja-Jpan
  text: |-
    名月や
    生れかはらば
    峰の松
  rights:
    status: public-domain
    basis: Author died in 1787.
translations:
  - language: fr-Latn
    text: |-
      Oh! le clair de lune!
      Si je change en renaissant,
      (Que je sois) un pin de la cime!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 398."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n411/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! moon, if born again, I’d be
      A pine-tree on a mountain peak.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 354, no. 189."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n381/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
