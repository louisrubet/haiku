id: issa-yasegaeru
status: published
added: "2026-11-22"
author: kobayashi-issa
form: hokku
season: spring
kigo: 蛙
original:
  language: ja-Jpan
  text: |-
    痩蛙
    まけるな一茶
    是に有り
  rights:
    status: public-domain
    basis: Author died in 1828.
translations:
  - language: fr-Latn
    text: |-
      Maigre grenouille,
      Ne cède pas : Issa
      Est ici!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 398."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n411/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Emaciated frog! be not
      Worsted in fight:—Issa is here.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 358, no. 199."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n385/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
