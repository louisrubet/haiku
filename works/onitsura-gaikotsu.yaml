id: onitsura-gaikotsu
status: published
added: "2026-11-22"
author: uejima-onitsura
form: hokku
season: spring
kigo: 花見
original:
  language: ja-Jpan
  text: |-
    骸骨の
    うへを粧ひて
    花見かな
  rights:
    status: public-domain
    basis: Author died in 1738.
translations:
  - language: fr-Latn
    text: |-
      De leurs squelettes
      Le dessus ayant couvert,
      Contemplation des fleurs!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 395."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n408/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! flower-gazers, who have decked
      The surface of their skeletons!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 346, no. 162."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n373/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
