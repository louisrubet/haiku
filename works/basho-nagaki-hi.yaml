id: basho-nagaki-hi
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: spring
kigo: ひばり
original:
  language: ja-Jpan
  text: |-
    永き日も
    囀り足らぬ
    ひばりかな
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Oh! l'alouette
      Qui ne cesse de chanter
      Toute la longue journée!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 387."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n400/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! skylark for whose carolling
      The livelong day sufficeth not!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 324, no. 90."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n351/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
