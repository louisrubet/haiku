id: buson-osoki-hi
status: published
added: "2026-11-22"
author: yosa-buson
form: hokku
season: spring
kigo: 遅き日
original:
  language: ja-Jpan
  text: |-
    遅き日の
    つもりて遠き
    むかしかな
  rights:
    status: public-domain
    basis: Author died in 1784.
translations:
  - language: fr-Latn
    text: |-
      Ah! le passé!
      Le temps où se sont accumulés
      Les jours lents!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 397."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n410/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! distant past, made up of slow
      But ever accumulating days!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 350, no. 176."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n377/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
