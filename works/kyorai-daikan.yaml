id: kyorai-daikan
status: published
added: "2026-11-22"
author: mukai-kyorai
form: hokku
season: summer
kigo: ほととぎす
original:
  language: ja-Jpan
  text: |-
    心なき
    代官殿や
    ほととぎす
  rights:
    status: public-domain
    basis: Author died in 1704.
translations:
  - language: fr-Latn
    text: |-
      L'insensible
      Résidence du daïkwan. Oh!
      Et le coucou!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 391."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n404/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The heartless Government Office,—ay! and the cuckoo.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 331, no. 112."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n358/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
