id: ransetsu-kiku-sakeri
status: published
added: "2026-11-22"
author: hattori-ransetsu
form: hokku
season: autumn
kigo: 菊
original:
  language: ja-Jpan
  text: |-
    菊さけり
    蝶来て遊べ
    絵の具皿
  rights:
    status: public-domain
    basis: Author died in 1707.
translations:
  - language: fr-Latn
    text: |-
      Les chrysanthèmes se sont épanouis
      Papillons, venez vous amuser
      Sur les tasses à couleurs!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 391."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n404/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
