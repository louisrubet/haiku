id: ransetsu-kiku-sakeri
status: published
added: "2026-11-22"
author: hattori-ransetsu
form: hokku
season: autumn
kigo: 菊
original:
  language: ja-Jpan
  text: |-
    菊さけり
    蝶来て遊べ
    絵の具皿
  rights:
    status: public-domain
    basis: Author died in 1707.
translations:
  - language: fr-Latn
    text: |-
      Les chrysanthèmes se sont épanouis
      Papillons, venez vous amuser
      Sur les tasses à couleurs!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 391."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n404/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The asters bloom. Come butterflies,
      And dally o’er the colour dish!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 329, no. 107."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n356/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
