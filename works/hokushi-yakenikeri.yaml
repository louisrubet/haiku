id: hokushi-yakenikeri
status: published
added: "2026-11-22"
author: tachibana-hokushi
form: hokku
season: spring
kigo: 花
original:
  language: ja-Jpan
  text: |-
    焼けにけり
    されども花は
    散りすまし
  rights:
    status: public-domain
    basis: Author died in 1718.
translations:
  - language: fr-Latn
    text: |-
      (Ma maison) a brûlé :
      Néanmoins, les fleurs
      Sont tombées et passées.
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 393."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n406/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      I am burnt out. Nevertheless,
      The flow’rs have duly bloom’d and faded.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 336, no. 132."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n363/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
