id: ranko-rokugatsu
status: published
added: "2026-11-22"
author: takakuwa-ranko
form: hokku
season: summer
kigo: 六月
original:
  language: ja-Jpan
  text: |-
    六月や
    至る処に
    温泉の流れ
  rights:
    status: public-domain
    basis: Author died in 1798.
translations:
  - language: fr-Latn
    text: |-
      Ah! le sixième mois!
      Et, partout,
      Des rivières d'eau chaude.
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 398."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n411/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      ’Tis July, and on every side
      Nothing but rivers of hot water.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 354, no. 190."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n381/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
