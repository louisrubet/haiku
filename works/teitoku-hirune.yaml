id: teitoku-hirune
status: published
added: "2026-11-22"
author: matsunaga-teitoku
form: hokku
season: autumn
kigo: 秋の月
original:
  language: ja-Jpan
  text: |-
    皆人の
    昼寝のたねや
    秋の月
  rights:
    status: public-domain
    basis: Author died in 1654.
translations:
  - language: fr-Latn
    text: |-
      Pour tous les hommes,
      Semence du sommeil pendant le jour :
      La lune d'automne!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 383."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n396/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
