author: naito-joso
form: hokku
season: autumn
kigo: 秋の蝉
original:
  language: ja-Jpan
  text: |-
    ぬけがらに
    ならびて死ぬる
    秋の蝉
  rights:
    status: public-domain
    basis: Author died in 1704.
translations:
  - language: fr-Latn
    text: |-
      Une cigale de l'automne,
      Morte à côté
      De sa coque vide!
