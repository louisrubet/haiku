id: joso-aki-no-semi
status: published
added: "2026-11-22"
author: naito-joso
form: hokku
season: autumn
kigo: 秋の蝉
original:
  language: ja-Jpan
  text: |-
    ぬけがらに
    ならびて死ぬる
    秋の蝉
  rights:
    status: public-domain
    basis: Author died in 1704.
translations:
  - language: fr-Latn
    text: |-
      Une cigale de l'automne,
      Morte à côté
      De sa coque vide!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 392."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n405/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      In autumn a cicada dead
      Beside the shell that it cast off.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 333, no. 120."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n360/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
