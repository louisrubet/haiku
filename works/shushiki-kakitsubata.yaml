id: shushiki-kakitsubata
status: published
added: "2026-11-22"
author: shushiki
form: hokku
season: summer
kigo: 杜若
original:
  language: ja-Jpan
  text: |-
    見し夢の
    さめても色の
    杜若
  rights:
    status: public-domain
    basis: Author died in 1725.
translations:
  - language: fr-Latn
    text: |-
      Du rêve que j'ai vu
      Réveillée, toujours la couleur
      De l'iris!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 394."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n407/mode/1up"
    notes: "Farewell poem."
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The dream I dreamt has faded, but
      The iris keeps its colours yet.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 344, no. 155."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n371/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
