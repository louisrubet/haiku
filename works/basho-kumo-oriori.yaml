id: basho-kumo-oriori
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: autumn
kigo: 月見
original:
  language: ja-Jpan
  text: |-
    雲をりをり
    人をやすむる
    月見かな
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Les nuages, de temps en temps,
      Nous font reposer le cou,
      Tandis que nous contemplons la lune!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 388."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n401/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! the moon-gazing where some clouds
      From time to time repose the eye!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 323, no. 87."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n350/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
