kigo: 雉
original:
  language: ja-Jpan
  text: |-
    蛇食ふと
    聞けばおそろし
    雉の声
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Qu'il mange les serpents,
      En apprenant cela, combien terrible
      La voix du faisan vert!
    translator: "michel-revon"
