id: soin-oranda
status: published
added: "2026-11-22"
author: nishiyama-soin
form: hokku
season: autumn
kigo: 雁
original:
  language: ja-Jpan
  text: |-
    阿蘭陀の
    文字か横たふ
    天つ雁
  rights:
    status: public-domain
    basis: Author died in 1682.
translations:
  - language: fr-Latn
    text: |-
      De Hollande
      Les caractères s'étendent :
      Telles les oies sauvages du ciel!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 383."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n396/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The wild-geese in the firmament,—
      These are Dutch letters sideways stretching.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 316, no. 66."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n343/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
