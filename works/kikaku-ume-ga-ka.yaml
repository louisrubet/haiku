id: kikaku-ume-ga-ka
status: published
added: "2026-11-22"
author: takarai-kikaku
form: hokku
season: spring
kigo: 梅が香
original:
  language: ja-Jpan
  text: |-
    梅が香や
    隣は荻生
    惣右衛門
  rights:
    status: public-domain
    basis: Author died in 1707.
translations:
  - language: fr-Latn
    text: |-
      Oh! le parfum du prunier!
      Il a pour voisin Oghyou
      Soémon!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 389."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n402/mode/1up"
    notes: "Traditionally attributed to Kikaku; the attribution is disputed."
    rights:
      status: public-domain
      basis: "Translator died in 1947."
