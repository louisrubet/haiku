id: buson-harusame
status: published
added: "2026-11-22"
author: yosa-buson
form: hokku
season: spring
kigo: 春雨
original:
  language: ja-Jpan
  text: |-
    春雨や
    ものがたりゆく
    蓑と傘
  rights:
    status: public-domain
    basis: Author died in 1784.
translations:
  - language: fr-Latn
    text: |-
      Ah! la pluie du printemps!
      S'en vont en conversant
      Un manteau de paille et un parapluie...
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 397."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n410/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      A show’r in spring, where an umbrella
      And rain-coat walk along conversing.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 351, no. 179."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n378/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
