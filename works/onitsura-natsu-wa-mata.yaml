id: onitsura-natsu-wa-mata
status: published
added: "2026-11-22"
author: uejima-onitsura
form: hokku
season: summer
kigo: 夏
original:
  language: ja-Jpan
  text: |-
    夏はまた
    冬がましじやと
    いはれけり
  rights:
    status: public-domain
    basis: Author died in 1738.
translations:
  - language: fr-Latn
    text: |-
      L'été, de nouveau :
      « L'hiver est préférable, »
      Disait-on.
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 395."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n408/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      And in the summer, folks opined
      That winter was to be preferred.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 345, no. 160."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n372/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
