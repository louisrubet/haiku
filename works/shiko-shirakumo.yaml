id: shiko-shirakumo
status: published
added: "2026-11-22"
author: kagami-shiko
form: hokku
season: summer
kigo: 百合
original:
  language: ja-Jpan
  text: |-
    しら雲や
    かきねを渡る
    百合の花
  rights:
    status: public-domain
    basis: Author died in 1731.
translations:
  - language: fr-Latn
    text: |-
      Oh! les blancs nuages!
      Traversant la haie,
      (Ce sont) des fleurs de lis!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 392."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n405/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! the white clouds! nay, rather blossoms,—
      Lilies that bend across the fence.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 334, no. 125."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n361/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
