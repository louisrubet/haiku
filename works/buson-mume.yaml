id: buson-mume
status: published
added: "2026-11-22"
author: yosa-buson
form: hokku
season: spring
kigo: 梅
original:
  language: ja-Jpan
  text: |-
    梅咲きぬ
    どれがむめやら
    うめぢやら
  rights:
    status: public-domain
    basis: Author died in 1784.
translations:
  - language: fr-Latn
    text: |-
      Le prunier est en fleurs.
      Lesquelles sont moumé,
      Lesquelles sont oumé?
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 397."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n410/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      The plum-tree is in blossom. Which [blossoms] are mume, and which ume?
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 353, no. 187."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n380/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
