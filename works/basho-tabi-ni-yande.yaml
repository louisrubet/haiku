id: basho-tabi-ni-yande
status: published
added: "2026-11-20"
author: matsuo-basho
form: hokku
season: winter
kigo: 枯野
tags: [journey, dreams, death]
original:
  language: ja-Jpan
  text: |-
    旅に病んで
    夢は枯野を
    かけ廻る
  romanization:
    language: ja-Latn
    system: Hepburn
    text: |-
      tabi ni yande
      yume wa kareno o
      kakemeguru
  composed: "1694"
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Tombé malade en voyage,
      En rêve, sur une plaine déserte
      Je me promène!
    translator: michel-revon
    translated: "1910"
    source: Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 389.
    source_url: https://archive.org/details/anthologiedelal00revogoog/page/n402/mode/1up
    notes: Bashō's last poem.
    rights:
      status: public-domain
      basis: Translator died in 1947.
  - language: en-Latn
    text: |-
      Ta’en ill while journeying, I dreamt
      I wandered o’er a withered moor.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 289, no. 38."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n316/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
