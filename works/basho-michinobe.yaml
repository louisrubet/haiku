id: basho-michinobe
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: autumn
kigo: 木槿
original:
  language: ja-Jpan
  text: |-
    道のべの
    木槿は馬に
    食はれけり
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Au bord du chemin
      La guimauve en arbre, par le cheval
      A été mangée...
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 386."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n399/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
