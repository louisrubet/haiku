id: izen-shigure
status: published
added: "2026-11-22"
author: hirose-izen
form: hokku
season: winter
kigo: しぐれ
original:
  language: ja-Jpan
  text: |-
    しぐれけり
    走り入りけり
    晴れにけり
  rights:
    status: public-domain
    basis: Author died in 1711.
translations:
  - language: fr-Latn
    text: |-
      L'averse est venue;
      Je suis venu et rentré en courant;
      Le ciel bleu est venu!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 393."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n406/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      A shower came, and so I came
      Running indoors; then blue sky came.
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 338, no. 138."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n365/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
