id: yayu-hirugao
status: published
added: "2026-11-22"
author: yokoi-yayu
form: hokku
season: summer
kigo: 昼顔
original:
  language: ja-Jpan
  text: |-
    昼顔や
    どちらの露も
    間に合はず
  rights:
    status: public-domain
    basis: Author died in 1783.
translations:
  - language: fr-Latn
    text: |-
      Ah! le Visage-du-jour!
      A qui aucune des rosées
      N'arrive à temps!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 397."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n410/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Alas! the noon convolvulus,
      That neither dew may aught avail!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 349, no. 171."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n376/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
