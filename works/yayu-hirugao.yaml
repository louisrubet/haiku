author: yokoi-yayu
form: hokku
season: summer
kigo: 昼顔
original:
  language: ja-Jpan
  text: |-
    昼顔や
    どちらの露も
    間に合はず
  rights:
    status: public-domain
    basis: Author died in 1783.
translations:
  - language: fr-Latn
    text: |-
      Ah! le Visage-du-jour!
      A qui aucune des rosées
      N'arrive à temps!
    translator: "michel-revon"
