id: etsujin-yamadera
status: published
added: "2026-11-22"
author: ochi-etsujin
form: hokku
season: autumn
kigo: 月夜
original:
  language: ja-Jpan
  text: |-
    山寺に
    米つくほどの
    月夜かな
  rights:
    status: public-domain
    basis: Author died in 1739.
translations:
  - language: fr-Latn
    text: |-
      Au temple de la montagne
      Le bruit du riz qu'on pile,
      Par une nuit de clair de lune!
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 393."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n406/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Oh! moonlight, with the sound of rice
      A-pounding in the mountain temple!
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 337, no. 135."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n364/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
