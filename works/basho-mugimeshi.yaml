id: basho-mugimeshi
status: published
added: "2026-11-22"
author: matsuo-basho
form: hokku
season: spring
kigo: 猫の妻
original:
  language: ja-Jpan
  text: |-
    麦飯に
    やつるる恋か
    猫の妻
  rights:
    status: public-domain
    basis: Author died in 1694.
translations:
  - language: fr-Latn
    text: |-
      Est-ce le riz mêlé d'orge,
      Est-ce l'amour, qui fait gémir
      La femme du chat?
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 387."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n400/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      Is it hard fare, or is it love
      That makes the cat’s goodwife so lean?
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 325, no. 96."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n352/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
