id: kyorai-nagagatana
status: published
added: "2026-11-22"
author: mukai-kyorai
form: hokku
season: spring
kigo: 花見
original:
  language: ja-Jpan
  text: |-
    何事ぞ
    花みる人の
    長刀
  rights:
    status: public-domain
    basis: Author died in 1704.
translations:
  - language: fr-Latn
    text: |-
      Le long sabre
      D'un homme qui regarde les fleurs,
      Oh! qu'est-ce que cela?
    translator: "michel-revon"
    translated: "1910"
    source: "Michel Revon, Anthologie de la littérature japonaise, des origines au XXe siècle, Paris, Delagrave, 5e éd., 1923, p. 391."
    source_url: "https://archive.org/details/anthologiedelal00revogoog/page/n404/mode/1up"
    rights:
      status: public-domain
      basis: "Translator died in 1947."
  - language: en-Latn
    text: |-
      A sabre! what has such to do
      On one who comes to view the flowers?
    translator: basil-hall-chamberlain
    translated: "1902"
    source: "Basil Hall Chamberlain, “Bashō and the Japanese Poetical Epigram”, Transactions of the Asiatic Society of Japan, vol. 30, part 2, 1902, p. 330, no. 111."
    source_url: https://archive.org/details/transactionsasi20japagoog/page/n357/mode/1up
    rights:
      status: public-domain
      basis: Translator died in 1935.
